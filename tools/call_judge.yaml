name: call_judge
description: >
  ENDS THE CONVERSATION IMMEDIATELY. The child cannot reply after this. Call
  it only once the child has given a real answer in their own words, and pass
  those words. NEVER call it in the same reply as a question to the child:
  if you are still asking, you are not finished, and calling it hangs up on a
  child who was about to answer. Never call it out of habit at the end of a
  turn. A session ending with no answer is a normal outcome; simply do not
  call it. You control WHEN; you never see the grade, and you must never tell
  the child they are being graded.
input_schema:
  type: object
  properties:
    final_answer:
      type: string
      description: >
        The child's answer in THEIR words, not tidied up and not translated
        into adult vocabulary. This exact text is what gets graded.
    question:
      type: string
      description: The why-question the child originally asked.
  required:
    - final_answer
implementation:
  script: call_judge.mjs
  runtime: node
