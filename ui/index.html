<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BDE3FF">
<title>Whyzr</title>
<style>
  :root {
    --cream: #FFF8EC;
    --sky: #BDE3FF;
    --sun: #FFD66B;
    --ink: #3A3350;
    --tutor: #FFFFFF;
    --kid: #D9F2D0;
    --accent: #FF8A5C;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body {
    /* Segoe UI first; the rest are the nearest native faces so a Mac or
       Linux box lands on its own system sans rather than a serif default. */
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                 system-ui, Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, var(--sky) 0%, var(--cream) 30%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { text-align: center; padding: 20px 10px 4px; }
  header h1 { font-size: clamp(1.8rem, 8vw, 2.2rem); letter-spacing: -.5px; font-weight: 650; }
  header h1 .why { color: var(--accent); }
  header p { opacity: .75; font-size: .95rem; margin-top: 2px; }

  /* ---- gate + setup cards ---- */
  .card {
    width: min(440px, 92vw);
    background: #fff;
    border-radius: 22px;
    padding: 22px 20px;
    margin: 18px 0;
    box-shadow: 0 4px 18px rgba(58,51,80,.12);
  }
  .card h2 { font-size: 1.25rem; margin-bottom: 6px; }
  .card p.help { font-size: .92rem; opacity: .7; margin-bottom: 14px; line-height: 1.4; }
  .card label { display: block; font-size: .9rem; margin: 12px 0 5px; opacity: .8; }
  .card input[type=text], .card input[type=number], .card input[type=password] {
    width: 100%; padding: 13px 15px; font-size: 1.05rem; font-family: inherit;
    border: 2px solid rgba(58,51,80,.15); border-radius: 14px; background: #fff; color: var(--ink);
  }
  .card input:focus { outline: 3px solid var(--sun); border-color: transparent; }
  .checkrow { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0 4px; font-size: .9rem; line-height: 1.35; }
  .checkrow input { width: 22px; height: 22px; flex: none; margin-top: 1px; }
  .btn {
    width: 100%; margin-top: 16px; padding: 15px; font-size: 1.1rem; font-family: inherit;
    font-weight: bold; color: var(--ink); background: var(--sun); border: none;
    border-radius: 999px; cursor: pointer;
  }
  .btn:active { transform: scale(.98); }
  .err { color: #C2410C; font-size: .9rem; margin-top: 10px; min-height: 1.1em; }
  .note { background: #EAF7E4; border-radius: 12px; padding: 10px 13px; font-size: .92rem; margin-top: 12px; }

  /* ---- chat ---- */
  #chat {
    width: min(680px, 94vw); flex: 1;
    padding: 12px 4px 150px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .bubble {
    max-width: 86%; padding: 14px 18px; border-radius: 22px;
    font-size: clamp(1rem, 4.2vw, 1.15rem); line-height: 1.45;
    box-shadow: 0 2px 6px rgba(58,51,80,.10); white-space: pre-wrap;
    overflow-wrap: anywhere; animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  .tutor { background: var(--tutor); border-bottom-left-radius: 6px; align-self: flex-start; }
  .kid   { background: var(--kid);   border-bottom-right-radius: 6px; align-self: flex-end; }
  .thinking { align-self: flex-start; opacity: .6; font-size: 1.4rem; letter-spacing: 4px; }
  .bubble strong { font-weight: 650; }
  .bubble em { font-style: italic; }
  .bubble code {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: .92em; background: rgba(58,51,80,.07);
    padding: 1px 5px; border-radius: 5px;
  }

  #dock {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px 14px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, var(--cream) 35%);
  }
  #mic {
    width: 78px; height: 78px; flex: none; border-radius: 50%; border: none;
    background: var(--sun); font-size: 2.2rem; cursor: pointer;
    box-shadow: 0 6px 16px rgba(58,51,80,.25); transition: transform .1s;
  }
  #mic:active { transform: scale(.95); }
  #mic.listening { background: var(--accent); animation: pulse 1.1s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,138,92,.55); }
    100% { box-shadow: 0 0 0 24px rgba(255,138,92,0); }
  }
  #typed {
    flex: 1; min-width: 0; max-width: 340px; padding: 14px 16px;
    border: 2px solid rgba(58,51,80,.18); border-radius: 999px;
    font-size: 16px; /* 16px stops iOS zooming on focus */
    font-family: inherit; background: #fff; color: var(--ink);
  }
  #typed:focus { outline: 3px solid var(--sun); border-color: transparent; }
  /* Session controls. These were bare lowercase words floating in the
     corners with no affordance, so they read as stray text rather than
     things you could press. Now they are chips: a surface, a border, a
     hover state, and sentence case. */
  #topbar {
    position: sticky; top: 0; z-index: 5;
    /* Same column as the conversation, so the controls read as belonging to
       it rather than being pinned to the far corners of a wide monitor. */
    width: min(680px, 94vw); display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 10px 4px;
    background: linear-gradient(180deg, rgba(214,236,250,.96), rgba(214,236,250,0));
    backdrop-filter: blur(6px);
  }
  #topbar.hidden { display: none !important; }
  .chip {
    font: inherit; font-size: .84rem; line-height: 1;
    padding: 9px 14px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,.9); color: var(--ink);
    border: 1px solid rgba(58,51,80,.14);
    box-shadow: 0 1px 3px rgba(58,51,80,.10);
    transition: background .15s, box-shadow .15s, transform .1s;
    white-space: nowrap;
  }
  .chip:hover { background: #fff; box-shadow: 0 2px 7px rgba(58,51,80,.16); }
  .chip:active { transform: scale(.97); }
  .chip:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  /* The escape hatch is deliberately the quieter of the two: available
     without inviting a child to reach for it first. */
  #giveup { opacity: .72; }
  #giveup:hover { opacity: 1; }
  #miclabel {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(2px + env(safe-area-inset-bottom)); font-size: .75rem; opacity: .5;
  }
  .hidden { display: none !important; }
  /* For grown-ups, not the child, so it lives in the header rather than
     competing with the mic caption at the bottom of the screen. */
  a.parentlink {
    display: inline-block; margin-top: 10px;
    font-size: .82rem; color: var(--ink); text-decoration: none;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(255,255,255,.72); border: 1px solid rgba(58,51,80,.12);
    transition: background .15s, box-shadow .15s;
  }
  a.parentlink:hover { background: #fff; box-shadow: 0 2px 7px rgba(58,51,80,.14); }
  a.parentlink:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
</style>
</head>
<body>
  <header>
    <h1><span class="why">Why</span>zr</h1>
    <p>the friend who asks why back</p>
    <a class="parentlink hidden" id="parentLink" href="/parent">Grown-ups: see the journal &rarr;</a>
  </header>

  <!-- Session controls, in a bar of their own. Sticky so "New adventure"
       stays reachable in a long conversation. -->
  <div id="topbar" class="hidden">
    <button id="giveup" class="chip" title="It is okay to ask">Just tell me the answer</button>
    <button id="newchat" class="chip" title="Start a fresh adventure">New adventure</button>
  </div>

  <!-- 1. access code -->
  <section id="gate" class="card hidden">
    <h2>Hello!</h2>
    <p class="help">Type the secret word the grown-up sent you.</p>
    <label for="code">Secret word</label>
    <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" id="codeBtn">Let me in</button>
    <div class="err" id="codeErr"></div>
  </section>

  <!-- 2. first-run setup -->
  <section id="setup" class="card hidden">
    <h2>Nice to meet you!</h2>
    <p class="help">Two quick things, then we can start wondering about stuff.</p>
    <label for="nick">What should I call you?</label>
    <input id="nick" type="text" maxlength="40" autocomplete="off" placeholder="a nickname is perfect">
    <label for="age">How old are you?</label>
    <input id="age" type="number" min="1" max="99" inputmode="numeric" placeholder="7">
    <!-- Consent, per WHYZR-HANDOFF-3 section 4. A tick box that only says "I
         am a parent" is not consent to anything, because it does not name
         what is being agreed to. This one says what is kept and what is not,
         since that is the whole of the decision being made. -->
    <div class="checkrow">
      <input id="parentOk" type="checkbox">
      <label for="parentOk" style="margin:0">
        I am a parent or guardian. I understand Whyzr keeps a nickname, an age
        and a journal of how my child reasons, that conversations themselves
        are not stored, and that I can have all of it deleted.
      </label>
    </div>
    <label for="pin">Parent PIN (4 to 8 digits, for the grown-up's page)</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <button class="btn" id="setupBtn">Start exploring</button>
    <div class="err" id="setupErr"></div>
  </section>

  <!-- 3. chat -->
  <main id="chat" class="hidden"></main>
  <div id="dock" class="hidden">
    <input id="typed" placeholder="or type here..." autocomplete="off">
    <button id="mic" title="Push to talk" aria-label="Push to talk">&#127908;</button>
  </div>
  <!-- The give-up control is a BUTTON, never keyword matching on what the
       child types: "just tell me" has too many phrasings to catch, and a
       classifier would add a model call and a new way to be wrong. A button
       is unambiguous, instantly loggable, and gives the child a visible way
       out, which matters more than the score. -->
  <div id="miclabel" class="hidden">press the button and talk</div>

<script>
  const $ = (id) => document.getElementById(id);
  const chat = $("chat"), mic = $("mic"), typed = $("typed");
  let busy = false, sessionOver = false, epoch = 0;

  const show = (...ids) => {
    ["gate", "setup", "chat", "dock", "miclabel", "topbar", "parentLink"]
      .forEach((id) => $(id).classList.add("hidden"));
    ids.forEach((id) => $(id).classList.remove("hidden"));
  };

  async function post(path, payload) {
    const r = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload || {}),
    });
    return { status: r.status, data: await r.json().catch(() => ({})) };
  }

  /**
   * The model writes markdown, so "what's *different*" was rendering with
   * literal asterisks. Render the emphasis instead of showing its syntax.
   *
   * Order matters and is the whole safety story: escape every HTML-special
   * character FIRST, then introduce only the tags we generate ourselves. Doing
   * it the other way round would let a model reply, or a question a child
   * pasted in, inject markup into the page.
   */
  function formatted(text) {
    const esc = String(text).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    return esc
      // **bold** and __bold__ before the single-mark forms, or the openers
      // of a bold run get eaten as italics.
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/__([^_\n]+)__/g, "<strong>$1</strong>")
      // *italic*. The no-whitespace-inside rule is markdown's own, and it
      // matters here more than most places: without it "2 * 3 and 4 * 5"
      // italicises the middle, and arithmetic is exactly what this tutor
      // spends its day on.
      .replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)(?<!\s)\*(?![*\w])/g, "$1<em>$2</em>")
      .replace(/(^|[^_\w])_(?!\s)([^_\n]+?)(?<!\s)_(?![_\w])/g, "$1<em>$2</em>")
      // `code`, which the tutor occasionally reaches for
      .replace(/`([^`\n]+)`/g, "<code>$1</code>");
  }

  function bubble(cls, text) {
    const b = document.createElement("div");
    b.className = "bubble " + cls;
    b.innerHTML = formatted(text);
    chat.appendChild(b);
    b.scrollIntoView({ behavior: "smooth", block: "end" });
    return b;
  }

  // iOS Safari refuses speechSynthesis unless it has been started once from a
  // real user gesture. Without this the read-aloud fallback, which is the
  // whole plan when speech recognition is missing, is silent on iPhones.
  let speechUnlocked = false;
  function unlockSpeech() {
    if (speechUnlocked) return;
    try {
      speechSynthesis.speak(new SpeechSynthesisUtterance(""));
      speechUnlocked = true;
    } catch (e) { /* nothing to unlock */ }
  }
  document.addEventListener("pointerdown", unlockSpeech, { once: true });
  document.addEventListener("keydown", unlockSpeech, { once: true });

  function speak(text) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const voices = speechSynthesis.getVoices();
      const nice = voices.find(v => /Samantha|Google US English|Karen|Zira/i.test(v.name))
        || voices.find(v => v.lang.startsWith("en"));
      if (nice) u.voice = nice;
      u.rate = 1.0; u.pitch = 1.15;
      speechSynthesis.speak(u);
    } catch (e) { /* text still shows */ }
  }

  async function send(text) {
    if (busy || sessionOver || !text.trim()) return;
    busy = true;
    const mine = epoch;
    bubble("kid", text);
    const dots = bubble("thinking", "● ● ●");
    try {
      const { data } = await post("/api/say", { text });
      if (mine !== epoch) return; // a new adventure started while we waited
      dots.remove();
      const reply = data.reply || data.error || "Oops, something tangled up.";
      bubble("tutor", reply);
      speak(reply);
      if (data.sessionEnded) {
        sessionOver = true;
        $("miclabel").textContent = "press new adventure to start again";
      }
    } catch (e) {
      dots.remove();
      bubble("tutor", "Oops, I lost my train of thought. Try again?");
    }
    busy = false;
  }

  // Clear the box only once the message is actually accepted: clearing first
  // silently destroyed anything typed while Whyzr was still thinking.
  typed.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (busy || sessionOver || !typed.value.trim()) return;
    const t = typed.value;
    typed.value = "";
    send(t);
  });

  // Voice in. Some browsers (notably iOS Safari) have no usable speech
  // recognition: hide the mic and lean on typing plus read-aloud instead.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const rec = new SR();
    rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => { mic.classList.remove("listening"); send(e.results[0][0].transcript); };
    rec.onend = () => mic.classList.remove("listening");
    rec.onerror = (e) => {
      mic.classList.remove("listening");
      // A denied mic used to leave a dead button and no explanation.
      if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) {
        mic.classList.add("hidden");
        $("miclabel").textContent = "type your question, I will read my answer out loud";
        typed.style.maxWidth = "none";
        bubble("tutor", "I could not hear you, but you can type to me down there and I will read my answers out loud!");
      }
    };
    mic.addEventListener("click", () => {
      unlockSpeech();
      if (mic.classList.contains("listening")) { rec.stop(); return; }
      speechSynthesis.cancel();
      mic.classList.add("listening");
      try { rec.start(); } catch (e) { mic.classList.remove("listening"); }
    });
  } else {
    mic.classList.add("hidden");
    $("miclabel").textContent = "type your question, I will read my answer out loud";
    typed.style.maxWidth = "none";
  }

  $("newchat").addEventListener("click", async () => {
    // Ignore a reply that lands after the reset, so an old answer cannot
    // appear in the fresh conversation.
    epoch += 1;
    busy = false;
    await post("/api/new");
    chat.innerHTML = ""; sessionOver = false;
    $("miclabel").textContent = SR ? "press the button and talk" : "type your question, I will read my answer out loud";
    hello();
  });

  $("giveup").addEventListener("click", async () => {
    if (sessionOver) return;
    epoch += 1;
    busy = false;
    sessionOver = true;
    const out = await post("/api/giveup");
    // Warm, never scolding. The child is told this was an honest thing to
    // do, because the score is not their business and the habit of asking is.
    bubble("tutor", (out && out.reply) || "That's okay. Ask me a new why question whenever you like.");
  });

  window.addEventListener("pagehide", () => {
    try { navigator.sendBeacon("/api/bye"); } catch (e) { /* best effort */ }
  });

  function hello(nickname) {
    bubble("tutor", nickname
      ? `Hi ${nickname}! I'm Whyzr. Ask me a WHY question, any one you like!`
      : "Hi! I'm Whyzr. Ask me a WHY question, any one you like!");
  }

  function startChat(nickname, note) {
    show("chat", "dock", "miclabel", "topbar", "parentLink");
    if (note) bubble("tutor", note);
    hello(nickname);
  }

  // ---- boot: who am I? ----
  $("codeBtn").addEventListener("click", async () => {
    const { status, data } = await post("/api/code", { code: $("code").value });
    if (status !== 200) { $("codeErr").textContent = data.error || "That did not work."; return; }
    data.setUp ? boot() : show("setup");
  });
  $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("codeBtn").click(); });

  $("setupBtn").addEventListener("click", async () => {
    const payload = {
      nickname: $("nick").value, age: $("age").value,
      pin: $("pin").value, parentConfirmed: $("parentOk").checked,
    };
    const { status, data } = await post("/api/setup", payload);
    if (status !== 200) { $("setupErr").textContent = data.error || "Something went wrong."; return; }
    await post("/api/new");
    startChat(data.nickname, data.note);
  });

  async function boot() {
    let me;
    try {
      const r = await fetch("/api/me");
      me = await r.json();
    } catch (e) {
      // A dropped connection used to leave a child staring at a blank page.
      show("chat", "dock", "miclabel");
      bubble("tutor", "I could not wake up just now. Check the internet and refresh the page to try again.");
      return;
    }
    if (!me.authed) return show("gate");
    if (!me.setUp) return show("setup");
    if (me.napping) {
      show("chat");
      bubble("tutor", "Whyzr is having a nap right now. Come back tomorrow and we will explore something new!");
      return;
    }
    await post("/api/new"); // every page open is a fresh adventure
    startChat(me.nickname);
  }

  speechSynthesis.getVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }
  boot();
</script>
</body>
</html>
