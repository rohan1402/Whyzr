hooks:
  pre_tool_use:
    - script: guard.sh
      description: >
        Child-safety guard. Deny-by-default policy: tools run only if
        explicitly allowed, the shell is disabled entirely, reads never
        touch hidden or internal files, writes are confined to memory/
        and workspace/, and the agent can never modify its own
        constitution (RULES.md, SOUL.md, agent.yaml, hooks/, tools/,
        skills/) or read secrets.
